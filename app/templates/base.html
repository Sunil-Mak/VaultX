<!DOCTYPE html>
<html lang="en">

<head>


  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="VaultX - Your Intelligent Digital Identity Vault">

  <title>

    {% block title %}
    VaultX
    {% endblock %}

  </title>

  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Font Awesome -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- Main CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Hero CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/hero.css') }}">

  <!-- Features CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/features.css') }}">

  {% block styles %}

  {% endblock %}

</head>

<body>

  <div class="page-wrapper">

    {% block content %}

    {% endblock %}

  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>

  {% block scripts %}

  {% endblock %}

</body>

</html>
