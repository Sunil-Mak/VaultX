<!DOCTYPE html>
<html lang="en">

<head>

      <meta charset="UTF-8">

      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>
            {% block title %}VaultX Dashboard{% endblock %}
      </title>

      <!-- Google Font -->

      <link rel="preconnect" href="https://fonts.googleapis.com">

      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet">

      <!-- Font Awesome -->

      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

      <!-- Dashboard CSS -->

      <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">

      <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">

      <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

      <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">

      <link rel="stylesheet" href="{{ url_for('static', filename='css/topbar.css') }}">

      <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

      <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">

      <link rel="stylesheet" href="{{ url_for('static', filename='css/document_detail.css') }}">

</head>

<body>

      <div class="dashboard-layout">

            <!-- SIDEBAR -->

            <aside class="sidebar">

                  <div class="logo">

                        <i class="fa-solid fa-shield-halved"></i>

                        <span>VaultX</span>

                  </div>

                  <nav class="sidebar-menu">

                        <a href="{{ url_for('dashboard.dashboard') }}" class="active">

                              <i class="fa-solid fa-house"></i>

                              Dashboard

                        </a>

                        <a href="#">

                              <i class="fa-solid fa-folder"></i>

                              Documents

                        </a>

                        <a href="{{ url_for('documents.upload') }}">
                              <i class="fa-solid fa-upload"></i>
                              Upload
                        </a>
                        <a href="#">

                              <i class="fa-solid fa-share-nodes"></i>

                              Shared

                        </a>

                        <a href="#">

                              <i class="fa-solid fa-robot"></i>

                              AI Assistant

                        </a>

                        <a href="#">

                              <i class="fa-solid fa-lock"></i>

                              Security

                        </a>

                        <a href="#">

                              <i class="fa-solid fa-gear"></i>

                              Settings

                        </a>

                  </nav>

                  <div class="sidebar-bottom">

                        <a href="#">

                              <i class="fa-solid fa-right-from-bracket"></i>

                              Logout

                        </a>

                  </div>

            </aside>

            <!-- MAIN -->

            <div class="main-content">

                  <!-- TOPBAR -->

                  <header class="topbar">

                        <div class="search-box">

                              <i class="fa-solid fa-magnifying-glass"></i>

                              <input type="text" placeholder="Search documents...">

                        </div>

                        <div class="topbar-right">

                              <button class="icon-btn">

                                    <i class="fa-solid fa-bell"></i>

                              </button>

                              <button class="icon-btn">

                                    <i class="fa-solid fa-moon"></i>

                              </button>

                              <div class="profile">

                                    <img src="{{ url_for('static', filename='images/default-avatar.png') }}"
                                          alt="Profile">

                                    <div>

                                          <strong>

                                                {{ current_user.name }}

                                          </strong>

                                          <small>

                                                Secure User

                                          </small>

                                    </div>

                              </div>

                        </div>

                  </header>

                  <!-- PAGE CONTENT -->

                  <main class="dashboard-page">

                        {% block content %}
                        {% endblock %}

                  </main>

            </div>

      </div>

      {% block scripts %}
      {% endblock %}

</body>

</html>
